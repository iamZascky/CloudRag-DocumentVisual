# Local Windows-Native General Document Visual-RAG Configuration

storage:
  base_dir: "./storage"
  models_dir: "E:/Shared_Models"
  hf_cache_dir: "E:/Shared_Models/huggingface/hub"
  torch_cache_dir: "E:/Shared_Models/torch"
  sqlite_db: "./storage/doc_archive.db"
  chroma_db: "./storage/chroma"
  pages_dir: "./storage/pages"
  enhanced_pages_dir: "./storage/enhanced_pages"
  output_text_dir: "./storage/outputtext"
  result_json: "./storage/result.json"

models:
  vision:
    model_id: "Qwen/Qwen2.5-VL-3B-Instruct"
    dtype: "bfloat16"
    device: "cuda"
    min_pixels: 200704   # 256 * 28 * 28
    max_pixels: 802816   # 1024 * 28 * 28
  embedding:
    model_name: "intfloat/multilingual-e5-small"
    device: "cpu"
    normalize: true

retrieval:
  rrf_k: 60
  default_limit: 5
  search_depth: 15
  default_mode: "hybrid"  # "hybrid", "fts", or "vector"

preprocessor:
  pdf_dpi: 300
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]
